<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RingOut — six-segment final GLB smoke</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;font:12px/1.4 monospace;color:#cfe}
  #cv{display:block;width:100vw;height:100vh}
</style>
<!-- Local vendored three@0.170.0 (tracked) — no CDN, zero external requests. -->
<script type="importmap">
{ "imports": { "three": "../../../assets/ring_collapse/validation/two_segment_pilot/vendor/three-r170/build/three.module.js",
               "three/addons/": "../../../assets/ring_collapse/validation/two_segment_pilot/vendor/three-r170/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
// Final-only smoke: load the APPROVED committed stand, verify its 12 roots,
// render one frame. No before-GLB, no captures, no comparison chain.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const GLB = '../../../assets/ring_collapse/validation/six_segment_rollout/'
          + 'ring_collapse_six_segment_simplified.glb';
const EXPECTED_ROOTS = [];
for (let i = 1; i <= 6; i++) {
  const nn = String(i).padStart(2, '0');
  EXPECTED_ROOTS.push(`Segment${nn}_Intact`, `Segment${nn}_Cracked_BALANCED`);
}

window.__fatal = null;
window.addEventListener('error', e => { if (!window.__fatal) window.__fatal = String(e.message); });
window.addEventListener('unhandledrejection', e => { if (!window.__fatal) window.__fatal = String(e.reason); });

async function main() {
  const canvas = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  const gltf = await new GLTFLoader().loadAsync(GLB);
  scene.add(gltf.scene);

  const rootNames = gltf.scene.children.map(n => n.name).sort();
  const missing = EXPECTED_ROOTS.filter(r => !rootNames.includes(r));
  let tris = 0;
  gltf.scene.traverse(o => {
    if (o.isMesh && o.geometry?.index) tris += o.geometry.index.count / 3;
  });

  const camera = new THREE.PerspectiveCamera(
    30, window.innerWidth / window.innerHeight, 0.05, 400);
  camera.position.set(0.8, 12.8, 23.8);
  camera.lookAt(0.45, 6.62, 13.52);
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const glErr = gl.getError();          // 0 (GL_NO_ERROR) expected

  window.__result = {
    roots: rootNames.length,
    missing_roots: missing,
    triangles: tris,
    gl_error: glErr,
  };
  window.__ready = true;
}
main().catch(e => { window.__fatal = String(e && e.stack || e); });
</script>
</body>
</html>
